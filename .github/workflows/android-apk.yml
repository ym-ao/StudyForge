name: Build StudyForge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studyforge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: StudyForge-2.1.12-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare and validate release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: studyforge-release
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing keystore is not configured; signed release APK will be skipped."
            exit 0
          fi

          if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::A signing password secret is missing. Configure SIGNING_STORE_PASSWORD and SIGNING_KEY_PASSWORD."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/release-key.jks
          test -s app/release-key.jks

          if ! keytool -list -keystore app/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore could not be opened with the configured store password, or it does not contain the expected alias 'studyforge-release'. Check the keystore and SIGNING_STORE_PASSWORD. The expected alias is fixed in the workflow; no alias secret is needed."
            echo "Aliases found in the keystore (if it can be opened):"
            keytool -list -keystore app/release-key.jks -storepass "$STORE_PASSWORD" 2>/dev/null | grep -E '^[[:space:]]*[^,]+,' || true
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore and expected alias validated."

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          SIGNING_STORE_FILE: app/release-key.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: studyforge-release
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: StudyForge-2.1.12-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f app/release-key.jks
