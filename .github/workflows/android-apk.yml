name: Build StudyForge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studyforge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run migration and backup regression checks
        run: |
          python3 tools/verify_migration_7_8.py
          python3 tools/verify_migration_8_9.py
          python3 tools/verify_migration_9_10.py
          python3 tools/verify_migration_10_11.py
          python3 tools/verify_migration_11_12.py
          python3 tools/verify_migration_12_13.py
          python3 tools/verify_migration_13_14.py
          python3 tools/verify_migration_14_15.py
          python3 tools/verify_migration_15_16.py
          python3 tools/verify_backup_schema_15.py
          python3 tools/verify_backup_media_import.py
          python3 tools/verify_backup_snapshot.py
          python3 tools/verify_bulk_tagging.py
          python3 tools/verify_bulk_collection.py
          python3 tools/verify_live_smart_filters.py
          python3 tools/verify_bulk_selection.py
          python3 tools/verify_session_preset_edit.py
          python3 tools/verify_study_ui_performance.py
          python3 tools/verify_navigation_layout.py
          python3 tools/verify_cloze_reimplementation.py
          python3 tools/verify_release_2_1_24.py
          python3 tools/verify_v2_source_integrity.py
          python3 tools/verify_v3_paging_foundation.py
          python3 tools/verify_v3_batch2_readiness.py
          python3 tools/verify_v3_batch3_readiness.py
          python3 tools/verify_v3_batch4_readiness.py
          python3 tools/verify_v3_batch5_readiness.py
          python3 tools/verify_v3_batch6_readiness.py
          python3 tools/verify_v3_batch7_readiness.py
          python3 tools/verify_v3_batch8_readiness.py
          python3 tools/benchmark_v3_scalability.py
          python3 tools/verify_v3_final_acceptance.py

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      # GitHub-hosted Ubuntu runners expose KVM. Set its permissions before
      # creating the AVD so the emulator can use hardware acceleration.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room runtime tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: StudyForge-V3.0-dev-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare and validate release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: studyforge-release
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing keystore is not configured; signed release APK will be skipped."
            exit 0
          fi

          if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::A signing password secret is missing. Configure SIGNING_STORE_PASSWORD and SIGNING_KEY_PASSWORD."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/release-key.jks
          test -s app/release-key.jks

          if ! keytool -list -keystore app/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore could not be opened with the configured store password, or it does not contain the expected alias 'studyforge-release'. Check the keystore and SIGNING_STORE_PASSWORD. The expected alias is fixed in the workflow; no alias secret is needed."
            echo "Aliases found in the keystore (if it can be opened):"
            keytool -list -keystore app/release-key.jks -storepass "$STORE_PASSWORD" 2>/dev/null | grep -E '^[[:space:]]*[^,]+,' || true
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore and expected alias validated."

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          SIGNING_STORE_FILE: app/release-key.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: studyforge-release
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: StudyForge-V3.0-dev-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f app/release-key.jks
